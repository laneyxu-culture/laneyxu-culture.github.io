---
layout: page
---
<style>
.bilingual { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 24px 0; }
@media (max-width: 700px) { .bilingual { grid-template-columns: 1fr; } }
.bilingual > div { padding: 16px 20px; border-radius: 12px; line-height: 1.75; }
.bilingual .en { background: #f7f9fc; border-left: 4px solid #B22222; }
.bilingual .zh { background: #fffdf5; border-left: 4px solid #D4AF37; }
</style>

<!-- 这里引用自定义的变量，并自己排版 -->
<h2 style="color: #333; margin-top: 10px; margin-bottom: 5px;">{{ page.story_title }}</h2>
{% if page.story_title_en %}<p style="color:#888; font-style:italic; font-size:1.1em; margin-top:0;">{{ page.story_title_en }}</p>{% endif %}
<p style="color:#999; font-size:0.9em;">{{ page.date | date: "%Y-%m-%d" }}</p>

<div style="background:#f0f2f5; color:#666; font-size:0.8em; padding:5px 12px; border-radius:6px; border-left:3px solid #999; margin:16px 0;">
  🤖 英文由机器翻译自中文，仅供参考 · English machine-translated from Chinese
</div>

<hr>

{{ content }}

<p style="margin-top:40px;">
  <a href="/exchange-stories/">← 返回所有日记</a>
</p>
